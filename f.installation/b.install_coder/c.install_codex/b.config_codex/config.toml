# ------------------------------
# 全局默认配置
# ------------------------------
# 默认使用的模型和提供商
model = "glm-5.1"
model_provider = "local"
model_reasoning_effort = "medium"

# ------------------------------
[model_providers.local]
name = "local"
base_url = "http://127.0.0.1:5172/v1"  # OpenAI 兼容API地址
env_key = "API_KEY"                      # APIKEY
wire_api = "responses"                   # 通信协议，固定为 chat（兼容 OpenAI）
timeout = 600                            # 超时时间（秒），本地模型推理较慢
max_retries = 3                          # 失败重试次数

[projects."/root/.codex"]
trust_level = "trusted"

